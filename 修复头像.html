<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的作品集</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg-color: #fafafa;
            --text-primary: #1a1a1a;
            --text-secondary: #666;
            --accent: #3b82f6;
            --card-bg: #ffffff;
            --border: #e5e7eb;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }
        
        header {
            padding: 80px 0 60px;
            text-align: center;
        }
        
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: 700;
            color: white;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            border: 4px solid white;
        }
        
        .avatar-text {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        
        .avatar-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        
        .avatar.has-image .avatar-image {
            display: block;
        }
        
        .avatar.has-image .avatar-text {
            display: none;
        }
        
        header h1 {
            font-size: 40px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        header .title {
            font-size: 18px;
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-weight: 500;
        }
        
        header .bio {
            font-size: 16px;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
        }
        
        .categories {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 48px;
            flex-wrap: wrap;
        }
        
        .category-btn {
            padding: 10px 24px;
            border: 1.5px solid var(--border);
            background: var(--card-bg);
            border-radius: 100px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .category-btn:hover {
            border-color: var(--text-primary);
            color: var(--text-primary);
        }
        
        .category-btn.active {
            background: var(--text-primary);
            color: white;
            border-color: var(--text-primary);
        }
        
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 32px;
            padding-bottom: 80px;
        }
        
        .project-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .project-card:hover {
            transform: translateY(-4px);
        }
        
        .project-cover {
            width: 100%;
            height: 220px;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .project-cover .placeholder {
            font-size: 64px;
            color: var(--text-secondary);
            opacity: 0.3;
        }
        
        .project-content {
            padding: 24px;
        }
        
        .project-category-tag {
            display: inline-block;
            padding: 4px 12px;
            background: #f3f4f6;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }
        
        .project-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .project-desc {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }
        
        .project-links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .project-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: var(--bg-color);
            border-radius: 8px;
            font-size: 13px;
            color: var(--text-primary);
            text-decoration: none;
        }
        
        .project-link:hover {
            background: var(--accent);
            color: white;
        }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 24px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .modal {
            background: var(--card-bg);
            border-radius: 16px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.95);
            transition: all 0.3s ease;
        }
        
        .modal-overlay.active .modal {
            transform: scale(1);
        }
        
        .modal-header {
            position: sticky;
            top: 0;
            background: var(--card-bg);
            padding: 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .modal-title {
            font-size: 24px;
            font-weight: 600;
        }
        
        .modal-close {
            width: 40px;
            height: 40px;
            border: none;
            background: var(--bg-color);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal-body {
            padding: 24px;
        }
        
        .modal-cover {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            border-radius: 12px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal-desc {
            color: var(--text-secondary);
            margin-bottom: 24px;
            line-height: 1.8;
        }
        
        .modal-links-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }
        
        .modal-links-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .modal-link-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            background: var(--bg-color);
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-primary);
        }
        
        .modal-link-item:hover {
            border: 1px solid var(--accent);
            transform: translateX(4px);
        }
        
        .modal-link-icon {
            width: 44px;
            height: 44px;
            background: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
        }
        
        .modal-link-info {
            flex: 1;
        }
        
        .modal-link-title {
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .modal-link-url {
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        @media (max-width: 768px) {
            header h1 {
                font-size: 32px;
            }
            .projects-grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }
        }
        
        .empty-state {
            text-align: center;
            padding: 80px 24px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div id="avatarContainer" class="avatar">
                <span id="avatarText" class="avatar-text">设</span>
                <img id="avatarImage" class="avatar-image" alt="头像">
            </div>
            <h1 id="headerName">你的名字</h1>
            <p class="title" id="headerTitle">产品设计师 · UX/UI 专家</p>
            <p class="bio" id="headerBio">专注于用户体验设计，创造简洁而有意义的数字产品。</p>
        </header>
        
        <nav class="categories" id="categories"></nav>
        <section class="projects-grid" id="projects"></section>
    </div>
    
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle"></h3>
                <button class="modal-close" onclick="closeModal()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script>
        const defaultData = {
            profile: {
                avatarImage: '',
                avatar: '设',
                name: '你的名字',
                title: '产品设计师 · UX/UI 专家',
                bio: '专注于用户体验设计，创造简洁而有意义的数字产品。'
            },
            projects: [
                {
                    id: '1',
                    name: '电商平台重构',
                    description: '对现有电商平台进行全面的用户体验重构，提升转化率和用户满意度。',
                    category: 'prototype',
                    links: [
                        { id: 'l1', title: 'Figma原型', url: 'https://figma.com' },
                        { id: 'l2', title: '交互演示', url: 'https://example.com' }
                    ]
                },
                {
                    id: '2',
                    name: '社交App产品需求文档',
                    description: '完整的社交应用PRD文档，包含用户研究、功能规格和技术需求。',
                    category: 'prd',
                    links: [
                        { id: 'l3', title: 'PRD文档', url: 'https://docs.google.com' },
                        { id: 'l4', title: '用户调研报告', url: 'https://example.com' }
                    ]
                }
            ]
        };

        function getData() {
            const saved = localStorage.getItem('portfolioData');
            if (saved) {
                return JSON.parse(saved);
            }
            localStorage.setItem('portfolioData', JSON.stringify(defaultData));
            return defaultData;
        }

        let activeCategory = 'all';

        function init() {
            const data = getData();
            const avatarContainer = document.getElementById('avatarContainer');
            const avatarImage = document.getElementById('avatarImage');
            const avatarText = document.getElementById('avatarText');
            
            if (data.profile.avatarImage) {
                avatarImage.src = data.profile.avatarImage;
                avatarContainer.classList.add('has-image');
            } else {
                avatarContainer.classList.remove('has-image');
                avatarText.textContent = data.profile.avatar || '设';
            }
            
            document.getElementById('headerName').textContent = data.profile.name;
            document.getElementById('headerTitle').textContent = data.profile.title;
            document.getElementById('headerBio').textContent = data.profile.bio;
            renderCategories();
            renderProjects();
        }

        function renderCategories() {
            const container = document.getElementById('categories');
            container.innerHTML = `
                <button class="category-btn ${activeCategory === 'all' ? 'active' : ''}" onclick="selectCategory('all')">全部</button>
                <button class="category-btn ${activeCategory === 'prototype' ? 'active' : ''}" onclick="selectCategory('prototype')">原型</button>
                <button class="category-btn ${activeCategory === 'prd' ? 'active' : ''}" onclick="selectCategory('prd')">PRD文档</button>
            `;
        }

        function getCategoryName(id) {
            return id === 'prototype' ? '原型' : 'PRD文档';
        }

        function renderProjects() {
            const data = getData();
            const container = document.getElementById('projects');
            const filtered = activeCategory === 'all' ? data.projects : data.projects.filter(p => p.category === activeCategory);
            
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state" style="grid-column: 1 / -1;">还没有作品，去后台添加吧！</div>';
                return;
            }

            container.innerHTML = filtered.map(project => `
                <div class="project-card" onclick="openModal('${project.id}')">
                    <div class="project-cover">
                        <span class="placeholder">📁</span>
                    </div>
                    <div class="project-content">
                        <span class="project-category-tag">${getCategoryName(project.category)}</span>
                        <h3 class="project-title">${project.name}</h3>
                        <p class="project-desc">${project.description}</p>
                        <div class="project-links">
                            ${project.links.slice(0, 3).map(link => 
                                `<a href="${link.url}" target="_blank" class="project-link" onclick="event.stopPropagation()">🔗 ${link.title}</a>`
                            ).join('')}
                            ${project.links.length > 3 ? `<span class="project-link">+${project.links.length - 3} 更多</span>` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function selectCategory(id) {
            activeCategory = id;
            renderCategories();
            renderProjects();
        }

        function openModal(projectId) {
            const data = getData();
            const project = data.projects.find(p => p.id === projectId);
            if (!project) return;

            document.getElementById('modalTitle').textContent = project.name;
            document.getElementById('modalBody').innerHTML = `
                <div class="modal-cover">
                    <span style="font-size: 64px; opacity: 0.3;">📁</span>
                </div>
                <p class="modal-desc">${project.description}</p>
                <div class="modal-links-title">相关链接</div>
                <div class="modal-links-list">
                    ${project.links.map(link => `
                        <a href="${link.url}" target="_blank" class="modal-link-item">
                            <div class="modal-link-icon">🔗</div>
                            <div class="modal-link-info">
                                <div class="modal-link-title">${link.title}</div>
                                <div class="modal-link-url">${link.url}</div>
                            </div>
                        </a>
                    `).join('')}
                </div>
            `;

            document.getElementById('modal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.body.style.overflow = '';
        }

        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        init();
    </script>
</body>
</html>
